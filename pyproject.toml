[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightloop"
version = "0.3.1"
description = "A small model-and-tools loop that runs in your own process."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Source = "https://github.com/ArchonCore/lightloop"

[tool.hatch.build.targets.wheel]
packages = ["src/lightloop"]
